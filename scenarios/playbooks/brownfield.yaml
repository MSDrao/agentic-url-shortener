    search: '    def count_clicks(self, link_id: int) -> int:'
    replace: |2-
          def record_click_if_allowed(
              self,
              link_id: int,
              clicked_at: datetime,
              referrer: str | None,
              user_agent: str | None,
          ) -> bool:
              """Record a click only while the link is under its limit.

              Check and insert happen in ONE statement, so concurrent redirects cannot
              overshoot the limit (no check-then-act race).
              """
              with self.db.write() as conn:
                  cur = conn.execute(
                      "INSERT INTO clicks (link_id, clicked_at, referrer, user_agent) "
                      "SELECT ?, ?, ?, ? FROM links l WHERE l.id = ? AND (l.max_clicks IS NULL "
                      "OR (SELECT COUNT(*) FROM clicks c WHERE c.link_id = l.id) < l.max_clicks)",
                      (link_id, clicked_at.isoformat(), referrer, user_agent, link_id),
                  )
                  return cur.rowcount == 1

          def count_clicks(self, link_id: int) -> int:
