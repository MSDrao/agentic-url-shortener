# Recorded agent responses for the brownfield scenario (offline provider).
# Edits are anchored search/replace operations against the baseline service/ code.

requirements:
  problem_statement: 'Support limited-use short links: a link may carry a maximum number of successful redirects,
    after which it stops redirecting - without changing behaviour for existing links or clients.'
  functional:
  - Accept an optional max_clicks (integer 1..1,000,000) when creating a link
  - Once a link has served max_clicks redirects, GET /{code} returns 410 Gone and records nothing
  - Link metadata exposes max_clicks and remaining_clicks (null when unlimited)
  - Links without max_clicks behave exactly as before
  non_functional:
  - Limit must hold under concurrent redirects (no overshoot)
  - Schema change must be additive and backward compatible (old code can run on the new schema)
  - No extra network calls on the redirect path
  domain_terms:
  - max_clicks
  - click
  - limit
  - redirect
  - link
  - remaining
  - migration
  out_of_scope:
  - Changing max_clicks after creation
  - Custom landing page for exhausted links
  acceptance_criteria:
  - id: AC1
    text: Creating a link with max_clicks returns it with max_clicks and remaining_clicks; remaining decreases per
      redirect
    verified_by:
    - tests/test_max_clicks.py::test_http_create_with_max_clicks_shows_remaining
  - id: AC2
    text: After max_clicks redirects the link returns 410 and further attempts are not counted
    verified_by:
    - tests/test_max_clicks.py::test_http_limit_reached_returns_410
  - id: AC3
    text: max_clicks outside 1..1,000,000 or non-integer is rejected with 422
    verified_by:
    - tests/test_max_clicks.py::test_http_invalid_max_clicks_rejected
    - tests/test_max_clicks.py::test_service_rejects_out_of_range_max_clicks
  - id: AC4
    text: Links created without max_clicks are unlimited and existing behaviour is unchanged (regression)
    verified_by:
    - tests/test_max_clicks.py::test_http_unlimited_links_unchanged
    - tests/test_api.py::test_redirect_is_307_and_counts_click
    - tests/test_api.py::test_stats_aggregate_by_day_and_referrer
  - id: AC5
    text: Under 20 concurrent redirects a max_clicks=5 link records exactly 5 clicks
    verified_by:
    - tests/test_max_clicks.py::test_repository_limit_is_atomic
  - id: AC6
    text: An existing v1 database migrates to v2 and existing links stay unlimited
    verified_by:
    - tests/test_max_clicks.py::test_migration_upgrades_existing_v1_database
    - tests/test_units.py::test_migrations_are_idempotent_and_versioned
  questions:
  - id: Q1
    about: limit-accounting
    question: Do rejected (over-limit) visits count in analytics?
    default: 'no: only successful redirects are recorded as clicks'
    options:
    - 'no'
    - yes, as a separate metric
  - id: Q2
    about: mutability
    question: Can max_clicks be changed after creation?
    default: 'no: immutable in this change (out of scope)'
    options:
    - immutable
    - PATCH endpoint
  - id: Q3
    about: concurrency
    question: Is small overshoot under concurrent load acceptable?
    default: 'no: the limit is enforced atomically'
    options:
    - exact
    - best-effort
design:
  title: Limited-use links (max_clicks)
  approach: 'Add a nullable links.max_clicks column (migration v2). Enforce the limit in the repository with a single
    conditional INSERT ... SELECT so check-and-record is atomic. The service maps ''not recorded'' to 410 Gone (same
    semantics as expiry). The API contract change is additive: an optional request field and two nullable response
    fields, so existing clients are unaffected.'
  api_changes:
  - 'POST /api/v1/links: optional max_clicks (1..1,000,000)'
  - 'GET /api/v1/links/{code} and POST response: + max_clicks, remaining_clicks (nullable)'
  - 'GET /{code}: 410 when the click limit is reached'
  schema_changes:
  - table: links
    column: max_clicks
    change: add nullable INTEGER (migration v2)
  data_handling:
    personal_data: []
  tasks:
  - id: T1
    title: 'Migration v2: nullable links.max_clicks'
    deps: []
    satisfies:
    - AC6
    files:
    - shortener/db.py
  - id: T2
    title: 'Model + repository: persist max_clicks, atomic record_click_if_allowed'
    deps:
    - T1
    satisfies:
    - AC5
    files:
    - shortener/models.py
    - shortener/repository.py
  - id: T3
    title: 'Service: validate range, enforce limit (410), remaining_clicks'
    deps:
    - T2
    satisfies:
    - AC2
    - AC3
    files:
    - shortener/service.py
  - id: T4
    title: 'API contract: request/response fields'
    deps:
    - T3
    satisfies:
    - AC1
    - AC3
    - AC4
    files:
    - shortener/schemas.py
    - shortener/api.py
  - id: T5
    title: Tests written from the ACs (test-first, parallel with T2)
    deps:
    - T1
    satisfies:
    - AC1
    - AC2
    - AC3
    - AC4
    - AC5
    - AC6
    files:
    - tests/test_max_clicks.py
  alternatives_considered:
  - option: Limit enforcement
    decision: Single conditional INSERT ... SELECT ... WHERE count < max_clicks
    why: Check-then-act in application code races under concurrency; one statement is atomic under SQLite's single
      writer and maps to a row lock / counter column on Postgres.
    rejected:
    - Read count then insert (overshoots under concurrency)
    - Denormalized counter column (faster at scale; needs backfill and dual-write)
  - option: Response when exhausted
    decision: 410 Gone
    why: Same semantics as expiry, which clients already handle.
    rejected:
    - 404 (hides that the link existed)
    - Redirect to a landing page (needs product input)
  - option: remaining_clicks source
    decision: Derived on read via COUNT(*) over the (link_id, clicked_at) index
    why: No second source of truth to keep consistent.
    rejected:
    - Stored counter
  risks:
  - risk: COUNT(*) per redirect on very hot limited links
    likelihood: low
    impact: medium
    mitigation: covered by index; switch to counter column if redirect p95 regresses
  - risk: Old code (after rollback) ignores limits on links created with max_clicks
    likelihood: low
    impact: medium
    mitigation: documented in rollback plan; notify marketing on rollback
  - risk: Clients with strict response schemas see two new fields
    likelihood: low
    impact: low
    mitigation: fields are additive and nullable
  rollback_plan: Redeploy the previous version; migration v2 only adds a nullable column, so v1 code runs unchanged
    on the v2 schema and no down-migration is needed. While rolled back, limited links behave as unlimited.
  changelog:
  - Add optional `max_clicks` to link creation; exhausted links return 410 Gone
  - Link metadata includes `max_clicks` and `remaining_clicks`
  - 'DB migration v2: nullable `links.max_clicks`'
