# Recorded agent responses for the ambiguous scenario (offline provider).
# Items with `when: {Q2: ...}` are included only if the clarified answer matches, so a
# human revising an answer at an approval gate changes the spec, design, tests and code.

requirements:
  problem_statement: Reduce abuse of the shortener as a vector for harmful destinations, and give marketing audience
    analytics - without identifying individuals and without adding latency to redirects.
  functional:
  - Reject creation of links whose destination domain (or a parent domain) is on an operator-managed denylist
  - when: &id001
      Q2: create_and_redirect
    text: Links whose destination becomes denylisted after creation stop redirecting (410)
  - Stats report unique visitors in addition to total clicks
  - 'Visitor identity is pseudonymous: keyed, daily-rotating hash; the raw IP address is never stored'
  - Visitor hashes are purged after the retention window
  non_functional:
  - 'Redirect path: no new network calls; one in-process HMAC; no extra queries'
  - 'Privacy: data minimisation, purpose limitation (aggregate analytics), retention <= policy maximum'
  domain_terms:
  - blocked
  - domain
  - visitor
  - unique
  - click
  - stats
  - redirect
  - hash
  - retention
  out_of_scope:
  - Third-party threat-intel feeds (Safe Browsing etc.)
  - Per-person click history
  - Geo-location
  acceptance_criteria:
  - id: AC1
    text: Creating a link to a denylisted domain or any of its subdomains returns 422
    verified_by:
    - tests/test_safety_analytics.py::test_http_denylisted_destination_rejected
    - tests/test_safety_analytics.py::test_denylist_matches_parent_domains_only
  - when: *id001
    id: AC2
    text: An existing link to a newly denylisted domain returns 410 and records no click
    verified_by:
    - tests/test_safety_analytics.py::test_http_existing_link_blocked_after_denylisting
  - id: AC3
    text: Stats include unique_visitors (distinct visitors per day)
    verified_by:
    - tests/test_safety_analytics.py::test_http_unique_visitors_in_stats
  - id: AC4
    text: The raw client IP never reaches storage
    verified_by:
    - tests/test_safety_analytics.py::test_raw_ip_never_persisted
  - id: AC5
    text: Visitor hash is keyed (secret) and rotates daily
    verified_by:
    - tests/test_safety_analytics.py::test_visitor_hash_is_keyed_and_rotates_daily
  - id: AC6
    text: Visitor hashes older than the retention window are purged; click counts remain
    verified_by:
    - tests/test_safety_analytics.py::test_visitor_hashes_purged_after_retention
  - id: AC7
    text: Existing behaviour is unchanged for links and clients (regression)
    verified_by:
    - tests/test_api.py::test_redirect_is_307_and_counts_click
    - tests/test_api.py::test_invalid_url_rejected
  questions:
  - id: Q1
    about: safer
    question: What threat does 'safer' address?
    default: block harmful destinations via an operator-managed domain denylist
    options:
    - domain denylist
    - external threat-intel lookup
    - link-enumeration hardening
  - id: Q2
    about: safer-scope
    question: Does the denylist apply only to new links, or also stop existing links?
    default: creation_only
    options:
    - creation_only
    - create_and_redirect
  - id: Q3
    about: who
    question: Does 'see who is clicking' mean identifying individuals?
    default: 'no: aggregate unique-visitor counts from a pseudonymous daily hash; no personal profiles'
    options:
    - aggregate only
    - identify individuals (requires legal basis + consent)
  - id: Q4
    about: quickly
    question: Is 'quickly' a delivery deadline or a latency requirement?
    default: latency (read together with 'without slowing redirects'); no deadline was given
  - id: Q5
    about: slowing
    question: What latency budget must redirects keep?
    default: no new I/O on the redirect path; one HMAC (~microseconds); p95 unchanged
  - id: Q6
    about: retention
    question: How long may visitor hashes be kept?
    default: 90 days (policy maximum)
design:
  title: Destination denylist + privacy-preserving visitor analytics
  approach: Denylist is configuration (SHORTENER_BLOCKED_DOMAINS) checked in URL validation with parent-domain matching.
    Unique visitors are counted from a keyed HMAC of day|ip|user-agent stored in a new nullable clicks.visitor_hash
    column (migration v2); the raw IP exists only in memory for the request. A retention job nulls hashes older
    than the window while keeping click counts.
  api_changes:
  - 'GET /api/v1/links/{code}/stats: + unique_visitors'
  - 'POST /api/v1/links: 422 for denylisted destinations'
  - when: *id001
    text: 'GET /{code}: 410 when the destination is denylisted'
  schema_changes:
  - table: clicks
    column: visitor_hash
    change: add nullable TEXT (migration v2)
  data_handling:
    personal_data:
    - client IP (transient, in memory only)
    - user agent (hash input)
    storage: pseudonymised
    keyed_hash: true
    hashing: HMAC-SHA256(server secret, day|ip|user-agent), truncated to 128 bits
    rotation: day is part of the hash input, so visitors cannot be linked across days
    retention_days: 90
    purpose: aggregate unique-visitor counts for marketing; no individual profiles or exports
  tasks:
  - id: T1
    title: 'Config: denylist, visitor secret, retention'
    deps: []
    satisfies: []
    files:
    - shortener/config.py
  - id: T2
    title: Denylist check with parent-domain matching (creation)
    deps:
    - T1
    satisfies:
    - AC1
    files:
    - shortener/validation.py
  - when: *id001
    id: T2b
    title: Enforce denylist on redirect for existing links
    deps:
    - T2
    satisfies:
    - AC2
    files:
    - shortener/service.py
  - id: T3
    title: 'Migration v2: clicks.visitor_hash; repository write/aggregate/purge'
    deps: []
    satisfies:
    - AC3
    - AC6
    files:
    - shortener/db.py
    - shortener/models.py
    - shortener/repository.py
  - id: T4
    title: 'Service: keyed daily visitor hash, retention purge'
    deps:
    - T1
    - T3
    satisfies:
    - AC4
    - AC5
    - AC6
    files:
    - shortener/service.py
  - id: T5
    title: 'API: pass client IP to service, expose unique_visitors'
    deps:
    - T4
    satisfies:
    - AC3
    - AC7
    files:
    - shortener/api.py
    - shortener/schemas.py
  - id: T6
    title: Tests from ACs
    deps:
    - T1
    satisfies:
    - AC1
    - AC3
    - AC4
    - AC5
    - AC6
    - AC7
    files:
    - tests/test_safety_analytics.py
  alternatives_considered:
  - option: Meaning of 'who is clicking'
    decision: Aggregate unique visitors from a pseudonymous daily hash
    why: Answers the marketing question (reach) without processing identities; keeps the change inside privacy policy.
    rejected:
    - Store raw IPs (personal data; needs legal basis, DPIA, access controls)
    - Cookies/fingerprinting (consent requirements)
  - option: Visitor hash construction
    decision: HMAC-SHA256 with a server secret, day in the input
    why: Unkeyed hashes of IPv4 are trivially brute-forced; the day component prevents cross-day tracking.
    rejected:
    - sha256(ip) (reversible by enumeration)
    - Static salt (enables long-term tracking)
  - option: Denylist source
    decision: Operator-managed config list with parent-domain matching
    why: No new network dependency on the redirect path; deterministic; feeds can populate it later.
    rejected:
    - Live threat-intel API call per redirect (latency + availability coupling)
  risks:
  - risk: Denylist is only as good as its curation
    likelihood: high
    impact: medium
    mitigation: 'follow-up: scheduled sync from a threat-intel feed'
  - risk: Random default secret makes unique counts restart-dependent
    likelihood: medium
    impact: low
    mitigation: SHORTENER_VISITOR_SECRET documented as required in production
  - risk: Unique visitors undercount users behind shared NAT
    likelihood: medium
    impact: low
    mitigation: user agent is part of the hash; documented as an estimate
  - when:
      Q2: creation_only
    risk: Existing links to newly denylisted domains keep working
    likelihood: medium
    impact: high
    mitigation: manual deactivation via DELETE
  rollback_plan: Redeploy the previous version. Migration v2 only adds a nullable column, so old code runs unchanged;
    optionally run UPDATE clicks SET visitor_hash = NULL to drop pseudonymous data.
  changelog:
  - Operator-managed destination denylist (SHORTENER_BLOCKED_DOMAINS), including subdomains
  - when: *id001
    text: Denylisted destinations also stop existing links (410)
  - 'Stats: `unique_visitors` from a keyed, daily-rotating pseudonymous hash (raw IPs are never stored)'
  - 'Retention: `LinkService.purge_visitor_data()` for the daily retention job'
  - 'DB migration v2: nullable `clicks.visitor_hash`'
